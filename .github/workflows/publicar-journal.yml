name: Publicar Journal

# Publica en GitHub Pages SOLO la aplicación, no el repositorio entero.
# Antes Pages servía la rama main tal cual y cualquier archivo del repo era público
# (CLAUDE.md, docs/, NinjaTrader/...). Ahora se monta una carpeta con lo que la app
# carga y solo eso sale a internet. Un archivo nuevo que la app necesite hay que
# añadirlo aquí; si no, dará 404 en producción.
# Requiere en GitHub → Settings → Pages → Source: "GitHub Actions".
# Y el repositorio PÚBLICO: con la cuenta gratuita, Pages no publica repositorios
# privados. El 24/09/2026 se probó privado y el Journal cayó entero (D-022).
# Diseño: docs/disenos/2026-09-24-unificacion-chaumer.md, fase 1.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'icons/**'
      - 'favicon.svg'
      - 'manifest.json'
      - 'sw.js'
      - '.github/workflows/publicar-journal.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; la que está en marcha termina.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar la carpeta publicada
        # create-icons.html no va: es la herramienta que generó icons/, no parte de la app.
        run: |
          mkdir _site
          cp -r index.html favicon.svg manifest.json sw.js js css icons _site/
          find _site -type f | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
