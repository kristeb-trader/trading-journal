<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trading Journal</title>
  <!-- /nuevo/ fue la dirección de prueba del rediseño «Cristal». Ya es el Journal: se pasa a la de siempre. -->
  <meta http-equiv="refresh" content="0; url=../">
  <style>body{background:#06130d;color:#e8f0ec;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0}a{color:#5fd4a8}</style>
</head>
<body>
  <p>El Journal nuevo ya es el de siempre. <a href="../">Abrir el Trading Journal</a></p>
  <script>
    // Si había un service worker de la versión de prueba, se va con su caché.
    navigator.serviceWorker?.getRegistrations().then(rs => rs.forEach(r => { if (r.scope.endsWith('/nuevo/')) r.unregister() }))
    caches?.keys().then(ks => ks.filter(k => k.startsWith('nqjournal-nuevo-')).forEach(k => caches.delete(k)))
    location.replace('../')
  </script>
</body>
</html>
